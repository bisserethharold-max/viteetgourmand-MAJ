<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration des Menus - Vite et Gourmand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    body, button, input, select, textarea { font-family: 'Playfair Display', Georgia, serif !important; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800">

  <nav class="bg-stone-900 text-white py-5 px-6 flex justify-between items-center">
    <a href="index.html" class="font-serif text-xl font-bold">Vite et Gourmand — Administration</a>
    <a href="index.html" class="text-sm text-stone-300 hover:text-white">&larr; Retour au site</a>
  </nav>

  <!-- Message si non autorisé -->
  <div id="acces-refuse" class="hidden max-w-2xl mx-auto mt-16 bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center" role="alert">
    <p class="font-bold mb-2">Accès réservé</p>
    <p class="text-sm">Cette page est réservée aux comptes Administrateur ou Employé. Connectez-vous avec un compte disposant des droits nécessaires.</p>
  </div>

  <div id="admin-content" class="hidden max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- FORMULAIRE DE CRÉATION / MODIFICATION -->
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 mb-10">
      <h2 class="text-lg font-bold mb-4" id="form-titre">Créer un nouveau menu</h2>
      <form id="menu-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="menu-id">

        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Titre *</label>
          <input type="text" id="menu-titre" required class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Description *</label>
          <textarea id="menu-description" required rows="3" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Thème *</label>
          <select id="menu-theme" required class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
            <option value="Noel">Noël</option>
            <option value="Paques">Pâques</option>
            <option value="Classique">Classique</option>
            <option value="Evenement">Événement</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Régime *</label>
          <select id="menu-regime" required class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
            <option value="classique">Classique</option>
            <option value="vegetarien">Végétarien</option>
            <option value="vegan">Vegan</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Nombre de personnes min. *</label>
          <input type="number" id="menu-personnes-min" required min="1" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Prix de base (€) *</label>
          <input type="number" id="menu-prix" required min="0" step="0.01" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Stock disponible</label>
          <input type="number" id="menu-stock" min="0" value="0" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Images (une URL par ligne)</label>
          <textarea id="menu-images" rows="2" placeholder="https://..." class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Conditions (délai de commande, stockage...)</label>
          <textarea id="menu-conditions" rows="2" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="md:col-span-2 flex gap-3">
          <button type="submit" class="bg-[#243029] hover:bg-[#8f3d35] text-white px-6 py-2.5 rounded-xl text-sm font-bold transition">Enregistrer</button>
          <button type="button" id="btn-annuler" class="hidden bg-stone-200 text-stone-700 px-6 py-2.5 rounded-xl text-sm font-bold">Annuler la modification</button>
        </div>
        <div id="form-message" class="hidden md:col-span-2 text-sm font-semibold p-3 rounded-lg" role="status" aria-live="polite"></div>
      </form>
    </div>

    <!-- LISTE DES MENUS EXISTANTS -->
    <h2 class="text-lg font-bold mb-4">Menus existants</h2>
    <div id="liste-menus" class="space-y-3">
      <p class="text-stone-400 text-sm">Chargement...</p>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3001/api';

    window.addEventListener('DOMContentLoaded', () => {
      verifierAcces();
    });

    function verifierAcces() {
      const clientRaw = localStorage.getItem('client');
      const client = clientRaw ? JSON.parse(clientRaw) : null;

      if (!client || (client.role !== 'admin' && client.role !== 'employe')) {
        document.getElementById('acces-refuse').classList.remove('hidden');
        return;
      }
      document.getElementById('admin-content').classList.remove('hidden');
      chargerListeMenus();
    }

    function getToken() {
      return localStorage.getItem('token');
    }

    async function chargerListeMenus() {
      const container = document.getElementById('liste-menus');
      try {
        const res = await fetch(`${API_URL}/menus`);
        const data = await res.json();
        const menus = data.menus || [];

        if (menus.length === 0) {
          container.innerHTML = `<p class="text-stone-400 text-sm">Aucun menu créé pour le moment.</p>`;
          return;
        }

        container.innerHTML = menus.map(m => `
          <div class="bg-white border border-stone-200 rounded-xl p-4 flex items-center justify-between">
            <div>
              <p class="font-bold text-sm text-stone-900">${m.titre}</p>
              <p class="text-xs text-stone-500">${m.theme} • ${m.regime} • ${Number(m.prix_base).toFixed(2)} € • Stock: ${m.stock_disponible}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="chargerPourModification(${m.idmenu})" class="text-xs bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-lg font-semibold">Modifier</button>
              <button onclick="supprimerMenu(${m.idmenu})" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg font-semibold">Supprimer</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        container.innerHTML = `<p class="text-red-500 text-sm">Impossible de charger les menus.</p>`;
      }
    }

    async function chargerPourModification(idmenu) {
      const res = await fetch(`${API_URL}/menus/${idmenu}`);
      const data = await res.json();
      const m = data.menu;

      document.getElementById('menu-id').value = m.idmenu;
      document.getElementById('menu-titre').value = m.titre;
      document.getElementById('menu-description').value = m.description;
      document.getElementById('menu-theme').value = m.theme;
      document.getElementById('menu-regime').value = m.regime;
      document.getElementById('menu-personnes-min').value = m.nombre_personnes_min;
      document.getElementById('menu-prix').value = m.prix_base;
      document.getElementById('menu-stock').value = m.stock_disponible;
      document.getElementById('menu-images').value = (m.images || []).map(i => i.url).join('\n');
      document.getElementById('menu-conditions').value = m.conditions || '';

      document.getElementById('form-titre').textContent = `Modifier : ${m.titre}`;
      document.getElementById('btn-annuler').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btn-annuler').addEventListener('click', resetFormulaire);

    function resetFormulaire() {
      document.getElementById('menu-form').reset();
      document.getElementById('menu-id').value = '';
      document.getElementById('form-titre').textContent = 'Créer un nouveau menu';
      document.getElementById('btn-annuler').classList.add('hidden');
    }

    document.getElementById('menu-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msgDiv = document.getElementById('form-message');
      const idmenu = document.getElementById('menu-id').value;

      const payload = {
        titre: document.getElementById('menu-titre').value,
        description: document.getElementById('menu-description').value,
        theme: document.getElementById('menu-theme').value,
        regime: document.getElementById('menu-regime').value,
        nombre_personnes_min: Number(document.getElementById('menu-personnes-min').value),
        prix_base: Number(document.getElementById('menu-prix').value),
        stock_disponible: Number(document.getElementById('menu-stock').value),
        conditions: document.getElementById('menu-conditions').value,
        images: document.getElementById('menu-images').value.split('\n').map(s => s.trim()).filter(Boolean),
        plats_ids: []
      };

      try {
        const url = idmenu ? `${API_URL}/menus/${idmenu}` : `${API_URL}/menus`;
        const method = idmenu ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur lors de l'enregistrement.");

        msgDiv.className = "md:col-span-2 text-sm font-semibold p-3 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200";
        msgDiv.textContent = data.message;
        msgDiv.classList.remove('hidden');

        resetFormulaire();
        chargerListeMenus();
      } catch (error) {
        msgDiv.className = "md:col-span-2 text-sm font-semibold p-3 rounded-lg bg-red-50 text-red-700 border border-red-200";
        msgDiv.textContent = error.message;
        msgDiv.classList.remove('hidden');
      }
    });

    async function supprimerMenu(idmenu) {
      if (!confirm("Supprimer définitivement ce menu ?")) return;
      try {
        const res = await fetch(`${API_URL}/menus/${idmenu}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        chargerListeMenus();
      } catch (error) {
        alert(error.message);
      }
    }
  </script>
</body>
</html>
