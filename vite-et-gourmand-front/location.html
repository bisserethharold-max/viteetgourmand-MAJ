<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location de matériel - Vite et Gourmand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body, button, input, select { font-family: 'Playfair Display', Georgia, serif !important; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800">

  <nav class="bg-white shadow-sm border-b border-stone-100 py-5 px-6 flex justify-between items-center">
    <a href="index.html" class="font-serif text-2xl font-bold text-[#243029]">Vite et Gourmand</a>
    <a href="index.html" class="text-sm font-semibold text-stone-600 hover:text-[#8f3d35]">&larr; Retour au site</a>
  </nav>

  <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-6 text-center">
    <h1 class="text-3xl sm:text-4xl font-serif font-bold text-stone-900">Location de matériel</h1>
    <p class="text-stone-500 mt-2">Vaisselle, mobilier, décoration — tout pour compléter votre réception.</p>
  </header>

  
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
    <div id="location-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <p class="col-span-3 text-center text-stone-400 text-sm">Chargement du matériel disponible...</p>
    </div>
  </section>


  <div id="detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4" role="dialog" aria-modal="true" aria-label="Détail et réservation du matériel">
    <div class="absolute inset-0 bg-stone-900/60" onclick="fermerDetail()"></div>
    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl relative z-10">
      <button type="button" onclick="fermerDetail()" aria-label="Fermer" class="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-600"><i data-lucide="x" class="w-5 h-5" aria-hidden="true"></i></button>
      <div id="detail-content"><p class="text-center text-stone-400 text-sm">Chargement...</p></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://viteetgourmand-maj-production.up.railway.app/api';

    window.addEventListener('DOMContentLoaded', () => {
      window.lucide.createIcons();
      chargerLocations();
      fetch(`${API_URL}/tracking/visite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: 'location.html' })
      }).catch(() => {});
    });

    async function chargerLocations() {
      const container = document.getElementById('location-container');
      try {
        const res = await fetch(`${API_URL}/locations`);
        const data = await res.json();
        const locations = data.locations || [];

        if (locations.length === 0) {
          container.innerHTML = `<p class="col-span-3 text-center text-stone-400 text-sm">Aucun matériel disponible pour le moment.</p>`;
          return;
        }

        container.innerHTML = locations.map(l => `
          <div class="bg-white rounded-2xl shadow-sm border border-stone-200/60 overflow-hidden flex flex-col">
            <img src="${l.image_url || 'https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=600&auto=format&fit=crop'}" alt="${l.titre}" class="w-full h-44 object-cover">
            <div class="p-5 flex flex-col flex-1">
              <h3 class="text-lg font-bold text-stone-900">${l.titre}</h3>
              <p class="text-sm text-stone-500 mt-1 flex-1">${l.description.slice(0, 90)}${l.description.length > 90 ? '…' : ''}</p>
              <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between text-sm">
                <span class="text-stone-500">Caution : <strong class="text-stone-900">${Number(l.caution).toFixed(2)} €</strong></span>
                <span class="text-lg font-black text-stone-900">${Number(l.prix_location).toFixed(2).replace('.', ',')} €<span class="text-xs font-normal text-stone-400">/jour</span></span>
              </div>
              <button onclick="voirDetail(${l.idlocation})" class="mt-4 w-full bg-[#243029] hover:bg-[#8f3d35] text-white py-2.5 rounded-xl text-xs font-bold transition">Voir le détail</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error(error);
        container.innerHTML = `<p class="col-span-3 text-center text-red-500 text-sm">Impossible de charger le matériel. Le serveur est-il démarré ?</p>`;
      }
    }

    async function voirDetail(idlocation) {
      const modal = document.getElementById('detail-modal');
      const content = document.getElementById('detail-content');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      content.innerHTML = `<p class="text-center text-stone-400 text-sm">Chargement...</p>`;

      try {
        const res = await fetch(`${API_URL}/locations/${idlocation}`);
        const data = await res.json();
        const l = data.location;

        content.innerHTML = `
          <h2 class="text-2xl font-serif font-bold text-stone-900 mb-3">${l.titre}</h2>
          <img src="${l.image_url || 'https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=600&auto=format&fit=crop'}" alt="${l.titre}" class="w-full h-48 object-cover rounded-xl mb-4">
          <p class="text-sm text-stone-600 mb-4">${l.description}</p>

          <div class="grid grid-cols-2 gap-4 text-sm mb-4">
            <p><strong>Prix / jour :</strong> ${Number(l.prix_location).toFixed(2).replace('.', ',')} €</p>
            <p><strong>Caution :</strong> ${Number(l.caution).toFixed(2).replace('.', ',')} €</p>
            <p><strong>Stock disponible :</strong> ${l.stock_disponible}</p>
          </div>

          ${l.conditions_recuperation ? `<div class="mb-3 bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800"><strong>Récupération :</strong> ${l.conditions_recuperation}</div>` : ''}
          ${l.conditions_remise ? `<div class="mb-4 bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800"><strong>Remise :</strong> ${l.conditions_remise}</div>` : ''}

          <div class="pt-4 border-t border-stone-100 space-y-3">
            <p class="text-xs font-bold uppercase text-stone-500">Réservation</p>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label for="resa-date-pret" class="block text-[10px] font-bold uppercase text-stone-400 mb-1">Date de prêt</label>
                <input type="date" id="resa-date-pret" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#8f3d35]">
              </div>
              <div>
                <label for="resa-date-retour" class="block text-[10px] font-bold uppercase text-stone-400 mb-1">Date de retour</label>
                <input type="date" id="resa-date-retour" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#8f3d35]">
              </div>
            </div>
            <div>
              <label for="resa-quantite" class="block text-[10px] font-bold uppercase text-stone-400 mb-1">Quantité souhaitée</label>
              <input type="number" id="resa-quantite" min="1" value="1" max="${l.stock_disponible}" class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#8f3d35]">
            </div>
          </div>

          <div id="resa-message" class="hidden mt-4 text-xs font-semibold p-3 rounded-lg" role="status" aria-live="polite"></div>
          <button onclick='reserverMateriel(${l.idlocation}, ${l.stock_disponible})' class="mt-5 w-full bg-[#243029] hover:bg-[#8f3d35] text-white py-3 rounded-xl text-sm font-bold transition" ${l.stock_disponible <= 0 ? 'disabled' : ''}>
            ${l.stock_disponible <= 0 ? 'Stock épuisé' : 'Réserver ce matériel'}
          </button>
        `;
      } catch (error) {
        content.innerHTML = `<p class="text-center text-red-500 text-sm">Impossible de charger le détail.</p>`;
      }
    }

    function fermerDetail() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function reserverMateriel(idlocation, stock) {
      const msgDiv = document.getElementById('resa-message');
      const token = localStorage.getItem('token');

      if (!token) {
        msgDiv.className = "mt-4 text-xs font-semibold p-3 rounded-lg bg-amber-50 text-amber-700 border border-amber-200";
        msgDiv.textContent = "Connectez-vous depuis la page d'accueil pour réserver.";
        msgDiv.classList.remove('hidden');
        return;
      }
      if (stock <= 0) return;

      const datePret = document.getElementById('resa-date-pret').value;
      const dateRetour = document.getElementById('resa-date-retour').value;
      const quantite = Number(document.getElementById('resa-quantite').value);

      if (!datePret || !dateRetour) {
        msgDiv.className = "mt-4 text-xs font-semibold p-3 rounded-lg bg-red-50 text-red-700 border border-red-200";
        msgDiv.textContent = "Merci de renseigner les dates de prêt et de retour.";
        msgDiv.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/locations/reserver`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ idlocation, quantite, date_pret: datePret, date_retour: dateRetour })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur lors de la réservation.");

        msgDiv.className = "mt-4 text-xs font-semibold p-3 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200";
        msgDiv.textContent = `Réservation #${data.idcommande} confirmée — Total : ${data.total.toFixed(2)} € + caution ${data.caution.toFixed(2)} € (${data.nombre_jours} jour(s))`;
        msgDiv.classList.remove('hidden');
      } catch (error) {
        msgDiv.className = "mt-4 text-xs font-semibold p-3 rounded-lg bg-red-50 text-red-700 border border-red-200";
        msgDiv.textContent = error.message;
        msgDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
