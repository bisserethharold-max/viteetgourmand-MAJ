<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body, button, input, textarea, select {
      font-family: 'Playfair Display', Georgia, serif !important;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen flex flex-col">

  <nav class="bg-[#243029] text-white py-4 px-6 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-tight">Espace Administration</h1>
    </div>
    <div class="flex items-center gap-6 text-sm">
      <a href="admin-dashboard.html" class="text-amber-400 font-bold">Dashboard</a>
      <a href="admin-menus.html" class="hover:text-amber-400 transition">Gestion Menus</a>
      <a href="admin-avis.html" class="hover:text-amber-400 transition">Modération Avis</a>
      <a href="index.html" class="text-stone-300 hover:text-white transition">Retour au site</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
    <h2 class="text-2xl font-bold text-stone-900 mb-6">Aperçu de l'activité</h2>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
        <p class="text-xs uppercase text-stone-400 font-bold mb-1">Commandes totales</p>
        <p id="stat-total-commandes" class="text-3xl font-black text-[#243029]">-</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
        <p class="text-xs uppercase text-stone-400 font-bold mb-1">Chiffre d'Affaires</p>
        <p id="stat-ca-total" class="text-3xl font-black text-[#8f3d35]">- €</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
        <p class="text-xs uppercase text-stone-400 font-bold mb-1">Avis en attente</p>
        <p id="stat-avis-attente" class="text-3xl font-black text-amber-600">-</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
      <h3 class="text-lg font-bold text-stone-900 mb-4">Dernières Commandes</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-stone-600">
          <thead class="bg-stone-50 text-stone-400 text-xs uppercase border-b border-stone-200">
            <tr>
              <th class="p-3">#</th>
              <th class="p-3">Client</th>
              <th class="p-3">Montant</th>
              <th class="p-3">Statut</th>
            </tr>
          </thead>
          <tbody id="table-commandes-body">
            <tr><td colspan="4" class="p-4 text-center text-stone-400">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    function echapperHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const API_URL = 'https://viteetgourmand-maj-production.up.railway.app/api';

    window.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) window.lucide.createIcons();
      chargerDashboard();
    });

    async function chargerDashboard() {
      try {
        const res = await fetch(API_URL + '/commandes', { credentials: 'include' });
        if (!res.ok) throw new Error('Erreur réseau ou non autorisé');
        const data = await res.json();
        const commandes = data.commandes || data || [];

        document.getElementById('stat-total-commandes').textContent = commandes.length;
        
        let ca = 0;
        commandes.forEach(function(c) { ca += Number(c.total || 0); });
        document.getElementById('stat-ca-total').textContent = ca.toFixed(2).replace('.', ',') + ' €';

        const body = document.getElementById('table-commandes-body');
        if (commandes.length === 0) {
          body.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-stone-400">Aucune commande enregistrée.</td></tr>';
          return;
        }

        body.innerHTML = commandes.slice(0, 10).map(function(c) {
          return '<tr class="border-b border-stone-100 hover:bg-stone-50">' +
            '<td class="p-3 font-bold">#' + c.idcommande + '</td>' +
            '<td class="p-3">' + echapperHTML(c.client_nom || c.prenom || 'Client') + '</td>' +
            '<td class="p-3 font-semibold">' + Number(c.total || 0).toFixed(2).replace('.', ',') + ' €</td>' +
            '<td class="p-3"><span class="bg-stone-100 text-stone-700 text-xs px-2 py-1 rounded-md">' + echapperHTML(c.statut || 'En attente') + '</span></td>' +
          '</tr>';
        }).join('');

      } catch (err) {
        console.error('Erreur tableau de bord :', err);
      }
    }
  </script>
</body>
</html>
