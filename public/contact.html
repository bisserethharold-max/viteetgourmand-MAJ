<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Vite et Gourmand</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <nav class="flex items-center justify-between px-6 py-4 bg-white shadow">
    <span class="text-xl font-bold">Vite &amp; Gourmand</span>
    <div class="hidden md:flex gap-6">
      <a href="index.html" class="hover:text-orange-600">Accueil</a>
      <a href="menus.html" class="hover:text-orange-600">Menus</a>
      <a href="contact.html" class="text-orange-600 font-semibold">Contact</a>
    </div>
  </nav>

  <main class="max-w-xl mx-auto mt-12 px-6">
    <h1 class="text-2xl font-bold mb-6">Nous contacter</h1>

    <form id="formulaire-contact" class="space-y-4">
      <div>
        <label for="titre" class="block mb-1 font-medium">Titre</label>
        <input type="text" id="titre" name="titre" required
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <div>
        <label for="email" class="block mb-1 font-medium">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <div>
        <label for="description" class="block mb-1 font-medium">Message</label>
        <textarea id="description" name="description" rows="5" required
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
      </div>

      <button type="submit"
        class="bg-orange-600 text-white font-semibold px-6 py-2 rounded hover:bg-orange-700">
        Envoyer
      </button>

      <p id="message-succes" class="text-green-600 font-medium"></p>
      <p id="message-erreur" class="text-red-600 font-medium"></p>
    </form>
  </main>

  <script>
    const API_URL = 'https://viteetgourmand-maj-production.up.railway.app/api';

    document.getElementById('formulaire-contact').addEventListener('submit', async (e) => {
      e.preventDefault();
      const donnees = {
        titre: document.getElementById('titre').value,
        email: document.getElementById('email').value,
        description: document.getElementById('description').value
      };
      await envoyerFormulaireContact(donnees);
    });

    async function envoyerFormulaireContact(donnees) {
      try {
        const reponse = await fetch(`${API_URL}/contact`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(donnees)
        });

        if (!reponse.ok) {
          throw new Error("Erreur lors de l'envoi du message.");
        }

        const resultat = await reponse.json();
        afficherMessageSucces(resultat.message);
        document.getElementById('formulaire-contact').reset();
      } catch (erreur) {
        afficherMessageErreur("Impossible d'envoyer votre message pour le moment.");
      }
    }

    function afficherMessageSucces(msg) {
      document.getElementById('message-succes').textContent = msg;
      document.getElementById('message-erreur').textContent = '';
    }

    function afficherMessageErreur(msg) {
      document.getElementById('message-erreur').textContent = msg;
      document.getElementById('message-succes').textContent = '';
    }
  </script>

</body>
</html>
