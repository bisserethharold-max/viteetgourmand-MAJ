version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: traiteur_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=traiteur_user
      - DB_PASSWORD= passwpord123
      - DB_NAME=mydb
      - MONGO_URI=mongodb://mongo_db:27017/vite_et_gourmand_stats
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - mysql_db
      - mongo_db
      - mailpit

  mysql_db:
    image: mysql:8.0
    container_name: traiteur_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: mydb
      MYSQL_USER: traiteur_user
      MYSQL_PASSWORD: password123 
    ports:
      - "3307:3306"
    volumes:
      - ./database/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - .db_data:/var/lib/mysql

  mongo_db:
    image: mongo:latest
    container_name: traiteur_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - .mongo_data:/data/db

  mailpit:
    image: axllent/mailpit
    container_name: traiteur_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"