version: '3.8'

services:

  mysql_db:
    image: mysql:8.0
    container_name: traiteur_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123 
      MYSQL_DATABASE: mydb                
      MYSQL_USER: traiteur_user          
      MYSQL_PASSWORD: password123        
    ports:
      - "3307:3306"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - .db_data:/var/lib/mysql

  mongo_db:
    image: mongo:latest
    container_name: traiteur_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - .mongo_data:/data/db